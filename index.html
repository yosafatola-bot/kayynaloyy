        let cart = [];

        // Format ke Mata Uang IDR (Rupiah)
        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        }

        // Tambah Produk ke Keranjang
        function addToCart(productId, categoryName) {
            const productList = categoryName === 'All' ? getAllProducts() : storeData[categoryName];
            const product = productList.find(p => p.id === productId);

            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            alert(`"${product.name}" berhasil dimasukkan ke keranjang!`);
        }

        // Ambil Semua Produk dari Seluruh Kategori
        function getAllProducts() {
            let all = [];
            for (const cat in storeData) {
                all = all.concat(storeData[cat]);
            }
            return all;
        }

        // Perbarui Tampilan Badge Keranjang dan Isi Modal
        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = totalCount;

            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-8">Keranjang belanja Anda masih kosong.</p>`;
                document.getElementById('cart-total-price').innerText = formatRupiah(0);
                return;
            }

            let totalPrice = 0;
            cart.forEach(item => {
                totalPrice += item.price * item.quantity;
                container.innerHTML += `
                    <div class="py-4 flex items-center justify-between gap-4">
                        <div class="flex items-center space-x-4">
                            <img src="${item.img}" alt="${item.name}" class="w-16 h-16 object-cover rounded-lg border">
                            <div>
                                <h4 class="font-bold text-gray-800">${item.name}</h4>
                                <p class="text-indigo-600 font-semibold">${formatRupiah(item.price)}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="updateQuantity('${item.id}', -1)" class="w-8 h-8 bg-gray-200 rounded-md hover:bg-gray-300 font-bold flex items-center justify-center">-</button>
                            <span class="font-medium">${item.quantity}</span>
                            <button onclick="updateQuantity('${item.id}', 1)" class="w-8 h-8 bg-gray-200 rounded-md hover:bg-gray-300 font-bold flex items-center justify-center">+</button>
                            <button onclick="removeFromCart('${item.id}')" class="text-red-500 hover:text-red-700 ml-2"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cart-total-price').innerText = formatRupiah(totalPrice);
        }

        // Ubah Kuantitas Item di Keranjang
        function updateQuantity(productId, change) {
            const item = cart.find(p => p.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    updateCartUI();
                }
            }
        }

        // Hapus Item dari Keranjang
        function removeFromCart(productId) {
            cart = cart.filter(p => p.id !== productId);
            updateCartUI();
        }

        // Kosongkan Keranjang
        function clearCart() {
            cart = [];
            updateCartUI();
        }

        // Tampilkan/Sembunyikan Modal Keranjang
        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        // Proses Checkout Sederhana
        function checkout() {
            if (cart.length === 0) {
                alert("Keranjang Anda kosong!");
                return;
            }
            alert("Terima kasih! Pesanan Anda sedang diproses untuk checkout.");
            cart = [];
            updateCartUI();
            toggleCartModal();
        }

        // Render Sidebar Kategori
        function renderCategories() {
            const categoryListEl = document.getElementById('category-list');
            categoryListEl.innerHTML = `<li><button onclick="filterCategory('All')" class="w-full text-left px-4 py-2 rounded-lg font-medium bg-indigo-50 text-indigo-700 category-btn transition">Semua Produk</button></li>`;

            for (const category in storeData) {
                categoryListEl.innerHTML += `
                    <li><button onclick="filterCategory('${category}')" class="w-full text-left px-4 py-2 rounded-lg font-medium text-gray-600 hover:bg-gray-100 category-btn transition">${category}</button></li>
                `;
            }
        }

        // Render Grid Produk ke Halaman
        let activeCategory = 'All';
        function renderProducts(categoryName = 'All') {
            activeCategory = categoryName;
            const productGrid = document.getElementById('product-grid');
            const titleEl = document.getElementById('current-category-title');
            const countEl = document.getElementById('item-count');
            productGrid.innerHTML = '';

            let itemsToDisplay = [];

            if (categoryName === 'All') {
                titleEl.innerText = "Semua Produk";
                itemsToDisplay = getAllProducts();
            } else {
                titleEl.innerText = categoryName;
                itemsToDisplay = storeData[categoryName];
            }

            countEl.innerText = `Menampilkan ${itemsToDisplay.length} produk`;

            itemsToDisplay.forEach(item => {
                productGrid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between border border-gray-100">
                        <div>
                            <div class="h-48 overflow-hidden bg-gray-100">
                                <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                            </div>
                            <div class="p-4">
                                <h3 class="font-bold text-gray-800 text-lg mb-1">${item.name}</h3>
                                <p class="text-indigo-600 font-semibold text-base">${formatRupiah(item.price)}</p>
                            </div>
                        </div>
                        <div class="p-4 pt-0">
                            <button onclick="addToCart('${item.id}', '${activeCategory}')" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-cart-plus"></i>
                                <span>Beli Sekarang</span>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(category) {
            renderProducts(category);
        }

        // Inisialisasi Toko saat Halaman Dimuat
        window.onload = function() {
            renderCategories();
            renderProducts('All');
        };
    </script>
</body>
</html>
